# Approved tag taxonomy for the Blog Auto-Tagger.
#
# Every tag has:
#   definition : when an editor should use the tag (one or two sentences)
#   examples   : illustrative post titles that clearly deserve the tag
#   aliases    : raw author tags (as typed on DEV.to, lowercase) that MERGE into this tag.
#                This is the alias map used to turn messy historical tags into approved labels.
#                Each alias belongs to exactly one approved tag (a test checks this).
#   keywords   : words and phrases the keyword baseline looks for in the title and body.
#                Matching is whole-word. A keyword written in lowercase matches any case;
#                a keyword written with capitals (e.g. "AI", "Rust", "in Go") matches that case only,
#                which keeps ordinary words like "rust" or "go" from triggering the tag.
#
# The order of tags below is the order used everywhere (model columns, reports, the app).

version: 1

tags:
  - name: Python
    definition: Posts where Python code, Python libraries or the Python ecosystem (Django, Flask, FastAPI, packaging) are a main subject.
    examples:
      - "Building a REST API with FastAPI and Pydantic"
      - "Five asyncio patterns every Python developer should know"
    aliases: [python, python3, py, django, flask, fastapi, pydantic, pythonprogramming]
    keywords: [python, python3, django, flask, fastapi, pydantic, pip install, virtualenv, venv, asyncio, pypi, poetry]

  - name: JavaScript
    definition: Posts about the JavaScript language or its runtimes and tooling (Node.js, Deno, Bun, npm), when not specifically about TypeScript or React.
    examples:
      - "Understanding closures and the event loop in JavaScript"
      - "Streaming large files with Node.js"
    aliases: [javascript, js, node, nodejs, npm, bunjs, bun, deno, ecmascript, vanillajs, express, expressjs]
    keywords: [javascript, node.js, nodejs, npm, ecmascript, es6, deno, bun, express.js, vanilla js, JS]

  - name: TypeScript
    definition: Posts where TypeScript's type system, configuration or TypeScript-specific patterns are a main subject.
    examples:
      - "Generics in TypeScript explained with real examples"
      - "Migrating a Node.js codebase to strict TypeScript"
    aliases: [typescript, ts, nestjs]
    keywords: [typescript, tsconfig, type-safe, type safety, type inference, generics, nestjs, zod]

  - name: React
    definition: Posts about React or frameworks built on it (Next.js, Remix), including hooks, components and state management in React.
    examples:
      - "When to use useMemo and useCallback in React"
      - "Server components in Next.js, explained"
    aliases: [react, reactjs, nextjs, next, remix, redux, reacthooks]
    keywords: [React, reactjs, react.js, next.js, nextjs, jsx, usestate, useeffect, react hooks, redux, server components]

  - name: Frontend
    definition: Browser-side development that is not specific to React - HTML, CSS, layout, accessibility, UI, and other frameworks such as Vue, Angular and Svelte.
    examples:
      - "Modern CSS layout with grid and container queries"
      - "Making a web form accessible to screen readers"
    aliases: [frontend, css, html, vue, vuejs, angular, svelte, sveltekit, astro, a11y, accessibility, ui, ux, tailwindcss, tailwind, webcomponents, frontendchallenge]
    keywords: [frontend, front-end, css, html, tailwind, vue, vue.js, angular, svelte, dom, responsive design, accessibility, flexbox, css grid, web components, ui design, browser]

  - name: API Development
