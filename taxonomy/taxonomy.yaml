    aliases: [security, cybersecurity, infosec, appsec, devsecops, privacy, zerotrust, owasp, authentication, auth, oauth, jwt, authorization, ethicalhacking, hacking, pentesting, malware, websecurity]
    keywords: [security, secure, vulnerability, vulnerabilities, cybersecurity, authentication, authorization, encryption, xss, csrf, sql injection, owasp, exploit, malware, phishing, zero trust, jwt, oauth, cve, penetration testing, threat model, attacker]

  - name: Machine Learning
    definition: Training, evaluating or deploying predictive models - classic ML, deep learning, computer vision and MLOps - as opposed to using LLM products.
    examples:
