      - "GraphQL vs REST: what we learned after a year"
    aliases: [api, apis, rest, restapi, graphql, grpc, openapi, webhooks, backend, backenddevelopment]
    keywords: [api, apis, rest api, restful, endpoint, endpoints, graphql, grpc, openapi, swagger, webhook, webhooks, backend, http request, status code, rate limit]

  - name: Security
